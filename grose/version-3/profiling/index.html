ull,null,null,"bagel.R",null,null,null,null,null,null,null,"bagel.R",null,null,"particle.R",null,null,null,"bagel.R",null,null,null,null,"bagel.R",null,null,null,null,"particle.R",null,null,null,"bagel.R",null,null,"example-2.R","particle.R",null,null,null,"bagel.R",null,null,null,"bagel.R",null,null,null,null,null,null,null,"bagel.R",null,null,"example-2.R","example-2.R","particle.R",null,null,null,"bagel.R",null,null,"particle.R",null,null,null,"bagel.R",null,null,"example-2.R","particle.R",null,null,null,"bagel.R",null,null,null,null,"particle.R",null,null,null,"bagel.R",null,null,"particle.R",null,null,null,"bagel.R",null,null,null,"particle.R",null,null,null,"bagel.R",null,null,null,null,null,null,null,"bagel.R",null,null,null,null,null,"bagel.R",null,null,"particle.R","example-2.R","example-2.R","particle.R",null,null,null,"bagel.R",null,null,null,null,"particle.R",null,null,null,"bagel.R",null,null,"example-2.R","particle.R",null,null,null,"bagel.R",null,null,null,null,null,null,"bagel.R",null,null,"particle.R","particle.R",null,null,null,"bagel.R",null,null,"particle.R",null,null,null,"bagel.R",null,null,"particle.R",null,null,null,"bagel.R",null,null,"bagel.R",null,null,null,null,null,"bagel.R",null,null,"particle.R",null,"particle.R",null,"particle.R",null,null,null,"bagel.R",null,null,null,"particle.R",null,null,null,"bagel.R",null,null]},"interval":10,"files":[{"filename":"particle.R","content":"\n# type\nsetClass(\"particle_type\", slots=list(prior = \"function\", H = \"function\", tau = \"integer\", post.mu = \"matrix\", post.sigma = \"matrix\", weight = \"numeric\", p0 = \"numeric\", p = \"numeric\"))\n# constructor\nparticle <- function(prior,H,tau,p0,p)\n{   \n   return(new(\"particle_type\", prior = prior, H = H, tau = tau, p0 = p0, p = p, post.mu = matrix(), post.sigma = matrix(), weight = 0.0))\n}\n\n# type\nsetClass(\"particle_kv_type\", slots=list(s = \"numeric\"),contains=\"particle_type\")\n# constructor\nparticle_kv <- function(prior,H,tau,p0,p,s)\n{\n   return(new(\"particle_kv_type\", prior = prior, H = H, tau = tau, p0 = p0, p = p, post.mu = matrix(), post.sigma = matrix(), weight = 0.0, s = s))\n}\n\n\n# set_weight\nsetGeneric(\"set_weight\",function(object,weight) standardGeneric(\"set_weight\"))\nsetMethod(\"set_weight\",c(\"particle_type\",\"numeric\"),\nfunction(object,weight)\n{\n  object@weight <- weight\n  return(object)\n})\n\n\n# theorem_1\nsetGeneric(\"theorem_1\",function(object.1,object.t,t) standardGeneric(\"theorem_1\"))\nsetMethod(\"theorem_1\",c(\"particle_type\",\"particle_type\",\"integer\"),\n          function(object.1,object.t,t)\n\t  {\n\t     # NOTE - IMPLEMENTED ONLY FOR UNIFORM FOR NOW\n\t     if(object.1@tau != 0) # has to be intial object\n\t     {\n\t       # throw an error !!\n\t     }\n\t     if(object.t@tau == object.1@tau) # initial particle\n\t     {\n\t       if(t == 1L)\n\t       {\n\t\t  weight <- object.1@p0  \n\t       }\n\t       else\n\t       {\n\t          weight <- object.t@weight\n\t       }\n\t       object.t@weight <- weight\n\t       return(object.t)\n\t       #return(new(class(object.t)[1], prior = object.t@prior, H = object.t@H, tau = object.t@tau,p0 = object.t@p0, p = object.t@p,\n\t       #                               post.mu = object.t@post.mu, post.sigma = object.t@post.sigma, weight = weight))\n             }\n\t     if(object.t@tau == t - 1L) # latest particle\n\t     {\n\t       weight <- object.1@weight*(1.0 - object.t@p0)/(object.t@p0*(t-1L))\n\t     }\n\t     else \n\t     {\n\t       if(t == 2)\n\t       {\n\t         weight <- (1.0 - object.t@p0) #\n\t       }\n\t       else\n\t       {\n\t         weight <- object.t@weight*(t-2L)/(t-1L)\n\t       }\n\t     }\n\n\t     object.t@weight <- weight\n\t     return(object.t)\n\t  })\n\n\n\n# theorem_2\nsetGeneric(\"theorem_2\",function(object,t) standardGeneric(\"theorem_2\"))\nsetMethod(\"theorem_2\",c(\"particle_type\",\"integer\"),\n          function(object,t)\n\t  {\n\t     if(object@tau != 0)\n\t     {\n\t       # throw an error !!\n\t     }\n\t     if(t == 1L)\n\t     {\n\t       prior.t <- object@prior(t)\n\t       post.mu.t <- prior.t$mu\n\t       post.sigma.t <- prior.t$sigma\n\t     }\n\t     else\n\t     {\n\t        prior.1 <- object@prior(1L)\n   \t\tprior.mu.1 <- prior.1$mu\n   \t\tprior.sigma.1 <- prior.1$sigma\n\n   \t\tprior.t <- object@prior(t)\n   \t\tprior.mu.t <- prior.t$mu\n   \t\tprior.sigma.t <- prior.t$sigma\n\n   \t\td1 <- nrow(prior.mu.1)\n   \t\td2 <- nrow(prior.sigma.1)\n\t\tn <- d1 + d2\n\n   \t\tsigma.beta.beta.t <- prior.sigma.t[1:d1,1:d1]\n   \t\tsigma.beta.gamma.t <- prior.sigma.t[1:d1,(d1+1):n]\n   \t\tsigma.gamma.beta.t <- prior.sigma.t[(d1+1):n,1:d1]\n   \t\tsigma.gamma.gamma.t <- prior.sigma.t[(d1+1):n,(d1+1):n]\n   \t\tmu.beta.t <- as.matrix(prior.mu.t[1:d1,1])\n   \t\tmu.gamma.t <- as.matrix(prior.mu.t[(d1+1):n,1])\n\n   \t\tB <- t(sigma.beta.gamma.t) %*% solve(sigma.beta.beta.t)\n   \n\t\t# sigma \n\n   \t\ttop_left <- object@post.sigma[1:d1,1:d1]\n   \t\ttop_right <- B %*% object@post.sigma[1:d1,1:d1]\n   \t\tbottom_left <- t(top_right)\n   \t\tbottom_right <- sigma.gamma.gamma.t + B %*% (object@post.sigma[1:d1,1:d1]-sigma.beta.beta.t)%*%t(B)\n\n   \t\tpost.sigma.t <- rbind(cbind(top_left,top_right),\n                                      cbind(bottom_left,bottom_right))\n\t\t# mu\n\n   \t\ttop <- as.matrix(object@post.mu[1:d1,1])\n   \t\tbottom <- mu.gamma.t + B %*% (as.matrix(object@post.mu[1:d1,1]) - mu.beta.t)\n\t\tpost.mu.t <- rbind(top,bottom)\n\t     }\n\t     object@tau <- t - 1L\n\t     object@post.mu <- post.mu.t\n\t     object@post.sigma <- post.sigma.t\n\t     return(object)\n\t  })\n\n# theorem_3\nsetGeneric(\"theorem_3\",function(object,t,y) standardGeneric(\"theorem_3\"))\nsetMethod(\"theorem_3\",c(\"particle_type\",\"integer\",\"numeric\"),\n          function(object,t,y)\n\t  {\n\t    y <- matrix(c(y),1,1)\n\t    prior.t <- prior(t)\n\t    mu <- object@post.mu\n\t    sigma <- object@post.sigma\n\t    H.t <- H(t,object@tau)\n\t    I <- diag(1)\n\t    e <- y - t(H.t) %*% mu\n\t    Q <- (t(H.t) %*% sigma %*% H.t) + I\n\t    Q <- Q[1,1] # treat Q as a scalar\n\t    A <- sigma %*% H.t%*% solve(Q)\n\t    sigma <- sigma - A %*% t(A) * Q\n\t    mu <- mu + A %*% e\n\n            object@post.mu <- mu\n\t    object@post.sigma <- sigma\n\t    return(object)\n\t  })\n\n\n\n# theorem_4\nsetGeneric(\"theorem_4\",function(object,t,y) standardGeneric(\"theorem_4\"))\nsetMethod(\"theorem_4\",c(\"particle_kv_type\",\"integer\",\"numeric\"),\n          function(object,t,y)\n\t  {\n             if(object@tau == 0L && t == 0L)\n\t     {\n\t        return(object)\n\t     }\n             sigma.post <- object@post.sigma\n\t     mu.post <- object@post.mu\n\t     \n\t     H.t.tau <- object@H(t,object@tau)\n\t     # sigma <- 1.0 # just testing - this needs to be in the devided particle - need more info on this\n\t     sigma <- object@s \n\t     var.pred <- sigma^2 * (1.0 + t(H.t.tau) %*% sigma.post %*% H.t.tau)\n\t     weight <- object@weight * dnorm(y,t(H.t.tau) %*% mu.post,sqrt(var.pred))\n\t     object@weight <- weight\n\t     return(object)\n\t  })\n\n","normpath":"/home/grosed/DASS/bagel/grose/version-3/particle.R"},{"filename":"bagel.R","content":"\n# type\nsetClass(\"bagel_kv_type\", slots=list(prior = \"function\", H = \"function\", p0 = \"numeric\", p = \"numeric\", sigma = \"numeric\", particles = \"list\", t = \"numeric\"))\n# constructor\nbagel_kv <- function(prior,H,p0,p,sigma)\n{\n   return(new(\"bagel_kv_type\", prior = prior, H = H, p0 = p0, p = p, sigma = sigma, particles = list(), t = 0L))\n}\n\n\n# update bagel object\nsetGeneric(\"update\",function(object,y) standardGeneric(\"update\"))\nsetMethod(\"update\",c(\"bagel_kv_type\",\"numeric\"),\nfunction(object,y)\n{\n\n   object@t <- object@t + 1L\n   if(object@t == 1L)\n   {\n      # first data \n      tau <- 0L\n      p <- particle_kv(object@prior,object@H,tau,object@p0,object@p,object@sigma)\n      p <- theorem_2(p,object@t)\n      p <- theorem_1(p,p,object@t)\n      p <- theorem_4(p,object@t,y)\n      p <- theorem_3(p,object@t,y)\n      object@particles <- append(object@particles,p)\n   }\n   else\n   {\n      object@particles <- append(object@particles,theorem_2(object@particles[[1]],object@t)) # add the new particle\n      object@particles <- Map(theorem_1 %><% list(object.1 = object@particles[[1]],t = object@t),object@particles)\n      object@particles <- Map(theorem_4 %><% list(t = object@t,y = y),object@particles)\n      object@particles <- Map(theorem_3 %><% list(t = object@t,y = y),object@particles)\n      sumW <- Reduce(\"+\",Map(function(.) .@weight,object@particles),0)\n      object@particles <- Map(function(p) return(set_weight(p,p@weight/sumW)),object@particles)\n   }\n   return(object)\n})\n\n\n# update bagel object\nsetGeneric(\"weights\",function(object) standardGeneric(\"weights\"))\nsetMethod(\"weights\",c(\"bagel_kv_type\"),\nfunction(object)\n{\n   weights <- unlist(Map(function(.) .@weight,object@particles))\n   return(weights)\n})\n\n\n\n\n\n\n\n\n\n\n\n\n","normpath":"/home/grosed/DASS/bagel/grose/version-3/bagel.R"},{"filename":"example-2.R","content":"\n## SET-UP FOR EXAMPLE 2\n\nH <- function(t,tau)\n{\n  ## definition of vectors a and b\n  ## taking from p.fearnhed bagel.R  ###\n  a <- function(t)\n  {\n    return(matrix(c(1,t),nc=1))\n  }\n\n  b <- function(t,tau)\n  {\n    if(t <= tau)\n    { \n      return(matrix(0,nc = 1,nr = 2))\n    }\n    else\n    {\n      return(matrix(c(1,t),nc = 1))\n    }\n  }\n  if(tau == 0)\n  {\n     return(a(t))\n  }\n  else\n  {\n     return(rbind(a(t),b(t,tau)))\n  }   \n}\n\n\nprior <- function(t)\n{\n\n  ## definition of prior\n  delta<-c(1,1,1) ###hyper-parameter\n\n  ##definition of matrices in THM2 at time t -- these are for tau = t-1\n  sigma.beta.beta <- diag(delta[1:2]) ##does not depend on t or tau\n  sigma.gamma.beta <- sigma.beta.gamma <- function(t)\n  {\n    return(diag(c(0,0)))\n  }\n  \n  sigma.gamma.gamma <- function(t)\n  {\n    return(matrix(delta[3]*c((t-1)^2,-(t-1),-(t-1),1),nc = 2))\n  }\n  mu.beta <- matrix(c(0,0),nc = 1)\n  ## again this is prior mean for tau = t-1\n  mu.gamma <- function(t)\n  {\n    return(matrix(c(0,0),nc = 1))\n  }\n  if(t == 1)\n  {\n    return(list(\"mu\" = mu.beta,\"sigma\" = sigma.beta.beta))\n  }\n  else\n  {\n    return(\n    list(\"mu\" = rbind(mu.beta,mu.gamma(t)),\n         \"sigma\" = rbind(cbind(sigma.beta.beta,sigma.beta.gamma(t)),cbind(sigma.gamma.beta(t),sigma.gamma.gamma(t)))\n          )\n         )\n   }\n}","normpath":"/home/grosed/DASS/bagel/grose/version-3/example-2.R"}],"prof_output":"/tmp/RtmpF94Gvq/file5e31e6d928a42.prof","highlight":{"output":["^output\\$"],"gc":["^<GC>$"],"stacktrace":["^\\.\\.stacktraceo(n|ff)\\.\\.$"]},"split":"h"}},"evals":[],"jsHooks":[]}</script>
